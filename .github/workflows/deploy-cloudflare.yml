# Deploys the game to Cloudflare Pages on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID. Until both exist the deploy step is skipped, so main stays green.
# The site is private until release: a Cloudflare Access application guards the custom domain and the
# project's pages.dev address (set up in the Cloudflare dashboard, not here).
name: deploy-cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT_NAME: unsaved

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip without Cloudflare secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing deployed."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - name: Build game
        if: env.HAS_TOKEN == 'true'
        run: npm run build -w @escape/game
      - name: Create the Pages project on first run
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || echo "Project exists."
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/game/dist --project-name="$PROJECT_NAME" --branch=main
